# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: KazumiTV
options:
  bundleIdPrefix: io.github.ericcartman9969
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
packages:
  KazumiCore:
    path: KazumiCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KazumiTV:
    type: application
    platform: tvOS
    sources:
      - path: KazumiTV/Sources
      - path: KazumiTV/Shared
      - path: KazumiTV/Resources
    dependencies:
      - package: KazumiCore
        product: KazumiCore
      - target: KazumiTopShelf
    settings:
      base:
        PRODUCT_NAME: Kazumi
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ericcartman9969.kazumitv
        CODE_SIGN_STYLE: Automatic
        # Set your team here or in Xcode > Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        INFOPLIST_FILE: KazumiTV/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: KazumiTV/KazumiTV.entitlements

  # Top Shelf: recently watched shows on the Apple TV home screen.
  KazumiTopShelf:
    type: tv-app-extension
    platform: tvOS
    sources:
      - path: KazumiTopShelf/ContentProvider.swift
      - path: KazumiTV/Shared
    settings:
      base:
        PRODUCT_NAME: KazumiTopShelf
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ericcartman9969.kazumitv.topshelf
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "3"
        INFOPLIST_FILE: KazumiTopShelf/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: KazumiTopShelf/KazumiTopShelf.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
